name: Auth primitives Linux

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/auth-primitives.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-primitives:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check native Argon2id
        run: node --input-type=module -e "import a from 'argon2'; const h=await a.hash('synthetic passphrase for CI',{type:a.argon2id,memoryCost:19456,timeCost:2,parallelism:1}); if(!(await a.verify(h,'synthetic passphrase for CI'))) process.exit(1)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node ../scripts/check-auth-migrations.mjs
      - run: npm audit --audit-level=high
